<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style></head><body><title>파닉스 리딩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: A형 카드 메인(하늘→풀밭 배경, 큰 둥근 카드 2x2, 아래 큰 초록 시작 버튼) + 한 화면에 한 활동만 보이는 수업 화면. 아이용 밝은 단일 테마. */
:root{
  --sky:#d3eefa; --meadow:#e4f5dd; --ink:#26384a; --muted:#607487; --paper:#ffffff;
  --sun:#fde7a2; --mint:#c9ecdc; --rose:#fbd2d7; --lilac:#e1daf6;
  --go:#2ea350; --go-deep:#1d8238; --ok:#2ea350; --miss:#d95767; --line:#cfe1ea;
  --f-title:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-letter:"Andika","Comic Sans MS",system-ui,sans-serif; /* 한 층 a, g — 유아 읽기용 글꼴 */
  color-scheme:light;
}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--sky) 0%,#e8f6fb 55%,var(--meadow) 100%);background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #2b7fd6;outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-title);font-size:clamp(22px,3.2vw,30px)}
.brand svg{width:38px;height:38px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:10px 18px;font-family:var(--f-title);font-size:17px;box-shadow:0 2px 0 var(--line)}
.pill-btn svg{width:20px;height:20px}
.hero{display:flex;align-items:flex-end;justify-content:center;margin-bottom:-28px;position:relative;z-index:1}
.lion{width:clamp(110px,16vw,150px);height:auto;border-radius:50%;box-shadow:0 4px 0 rgba(38,56,74,.08)}
.today{background:rgba(255,255,255,.78);border:3px solid #bfe6d2;border-radius:32px;padding:40px clamp(16px,3vw,32px) 24px;display:flex;flex-direction:column;gap:18px;align-items:center}
.today h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(28px,4vw,38px);text-wrap:balance}
.sub{background:var(--mint);border-radius:999px;padding:4px 16px;font-size:15px}
.sample{font-size:14px;color:var(--muted);text-align:center}
.sample b{font-family:var(--f-letter);color:var(--ink);font-size:16px;letter-spacing:.06em}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-title);font-size:18px;background:#fff;border:3px solid var(--line);color:var(--muted)}
.dot.done{background:var(--go);border-color:var(--go);color:#fff}
.dot.now{border-color:var(--go);color:var(--go-deep);background:#eafbef;transform:scale(1.1)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}
.card{position:relative;border-radius:26px;padding:20px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center;box-shadow:0 5px 0 rgba(38,56,74,.08)}
.card .ico{height:64px;display:grid;place-items:center}
.card .ico svg{width:64px;height:64px}
.card .nm{font-family:var(--f-title);font-size:clamp(22px,3vw,28px)}
.card .st{font-size:14px;color:var(--muted)}
.c1{background:var(--sun)} .c2{background:var(--mint)} .c3{background:var(--rose)} .c4{background:var(--lilac)}
.card.locked{opacity:.55}
.badge{position:absolute;top:10px;right:12px;border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.badge.ok{background:var(--go);color:#fff}
.tiles-mini{display:flex;gap:4px}
.tiles-mini span{font-family:var(--f-letter);font-weight:700;font-size:26px;background:#fff;border-radius:10px;width:40px;height:44px;display:grid;place-items:center}
.start{width:min(560px,100%);background:var(--go);color:#fff;border-radius:999px;padding:18px 24px;font-family:var(--f-title);font-size:clamp(26px,3.6vw,34px);display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 0 var(--go-deep)}
.start:active{transform:translateY(3px);box-shadow:0 3px 0 var(--go-deep)}
.start svg{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 20px;font-size:16px;max-width:calc(100% - 32px);z-index:20}
/* lesson */
.lesson-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.step-name{font-family:var(--f-title);font-size:clamp(22px,3vw,28px)}
.stage{background:var(--paper);border-radius:32px;padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:20px;align-items:center;min-height:420px;box-shadow:0 6px 0 rgba(38,56,74,.07)}
.parent-note{width:100%;background:#f3f8fb;border:2px dashed var(--line);border-radius:18px;padding:12px 16px;font-size:16px;line-height:1.55;color:var(--ink)}
.parent-note .who{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;margin-right:6px}
.big{font-family:var(--f-letter);font-weight:700;font-size:clamp(84px,16vw,150px);line-height:1;letter-spacing:.04em}
.big.split{letter-spacing:.35em;color:var(--go-deep)}
.say{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;background:#f1f4f6;border-radius:999px;padding:8px 14px}
.say svg{width:20px;height:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.btn{border-radius:20px;padding:16px 22px;font-family:var(--f-title);font-size:22px;min-width:150px;box-shadow:0 4px 0 rgba(38,56,74,.12)}
.btn.ok{background:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-deep)}
.btn.again{background:#fff;border:3px solid var(--line)}
.btn.next{background:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-deep)}
.hint{width:100%;background:#fff6dc;border-radius:16px;padding:12px 16px;line-height:1.55}
.word-tiles{display:flex;gap:12px;justify-content:center}
.tile{font-family:var(--f-letter);font-weight:700;font-size:clamp(56px,10vw,88px);width:clamp(84px,14vw,120px);height:clamp(96px,16vw,136px);border-radius:22px;background:#eef6fa;border:4px solid var(--line);display:grid;place-items:center}
.tile.lit{background:var(--sun);border-color:#f0c64a}
.blendbar{font-family:var(--f-letter);font-weight:700;font-size:clamp(48px,9vw,76px);background:var(--mint);border-radius:22px;padding:6px 40px}
.slots{display:flex;gap:12px;justify-content:center}
.slot{width:clamp(76px,13vw,110px);height:clamp(88px,15vw,124px);border-radius:20px;border:4px dashed #9fc3d3;display:grid;place-items:center;font-family:var(--f-letter);font-weight:700;font-size:clamp(52px,9vw,80px);background:#fbfdfe}
.slot.filled{border-style:solid;border-color:#f0c64a;background:var(--sun)}
.slots.shake{animation:shake .4s}
.slots.good .slot{border-color:var(--go);background:#dff5e6}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick button{font-family:var(--f-letter);font-weight:700;font-size:44px;width:78px;height:86px;border-radius:18px;background:#eef6fa;border:3px solid var(--line)}
.pick button:disabled{opacity:.3}
.reveal{font-size:15px;background:#f1f4f6;border-radius:12px;padding:8px 14px}
.reveal b{font-family:var(--f-letter);font-size:22px}
.checklist{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:10px}
.checklist .item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#f5f9fb;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-size:17px;line-height:1.45}
.checklist .box{flex:none;width:34px;height:34px;border-radius:10px;border:3px solid #9fc3d3;display:grid;place-items:center;background:#fff}
.checklist .done{border-color:var(--go);background:#ecf9f0}
.checklist .done .box{background:var(--go);border-color:var(--go)}
.checklist .box svg{width:20px;height:20px}
.mini-choice{display:flex;gap:10px;margin-top:8px}
.mini-choice button{font-family:var(--f-letter);font-weight:700;font-size:28px;padding:6px 18px;border-radius:14px;background:#fff;border:3px solid var(--line);width:auto}
.mini-choice button.right{background:#dff5e6;border-color:var(--go)}
.mini-choice button.wrong{background:#fde4e7;border-color:var(--miss)}
.sentence{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-family:var(--f-letter);font-weight:700;font-size:clamp(46px,8vw,72px)}
.sentence button{border-radius:14px;padding:0 6px;border-bottom:5px solid transparent}
.sentence button.lit{background:var(--sun);border-bottom-color:#f0c64a}
.sentence .sw{color:#8a5bd1}
.q{font-family:var(--f-title);font-size:24px}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choices button{font-family:var(--f-letter);font-weight:700;font-size:40px;padding:10px 26px;border-radius:18px;background:#eef6fa;border:3px solid var(--line)}
.choices button.right{background:#dff5e6;border-color:var(--go)}
.choices button.wrong{background:#fde4e7;border-color:var(--miss)}
.counter{font-size:14px;color:var(--muted)}
.cheer{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cheer h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(30px,4.6vw,42px)}
.stars{display:flex;gap:8px}
.stars svg{width:46px;height:46px}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(.7);opacity:.4}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
}
/* parent */
.panel{background:var(--paper);border-radius:28px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:24px}
.panel p{margin:0;line-height:1.6;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:16px}
th{font-size:14px;color:var(--muted);font-weight:400}
.meter{height:10px;border-radius:99px;background:#edf2f5;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--go)}
.jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.jump button{background:#f3f8fb;border:2px solid var(--line);border-radius:16px;padding:12px;font-size:16px;text-align:left;line-height:1.35}
.jump b{font-family:var(--f-title);font-weight:400;font-size:18px;display:block}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.soon div{border:2px dashed var(--line);border-radius:16px;padding:12px;color:var(--muted);font-size:15px;line-height:1.5}
.soon b{color:var(--ink);display:block;font-family:var(--f-title);font-weight:400;font-size:18px}
.speak{display:inline-flex;align-items:center;gap:8px;background:#e6f4fb;border:3px solid #9fd0e6;border-radius:999px;padding:10px 20px;font-family:var(--f-title);font-size:19px}
.speak svg{width:26px;height:26px}
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.rec-row .lbl{font-family:var(--f-letter);font-weight:700;font-size:34px;min-width:70px}
.rec-row .ex{color:var(--muted);font-size:15px;flex:1 1 100px;font-family:var(--f-letter)}
.rec-row .stt{font-size:14px;border-radius:999px;padding:3px 10px;background:#f1f4f6}
.rec-row .stt.ok{background:#dff5e6;color:#1d6b33}
.rec-row .acts{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:15px}
.sbtn.rec{background:var(--miss);border-color:var(--miss);color:#fff}
.sbtn.go{background:var(--go);border-color:var(--go);color:#fff}
.rec-msg{width:100%;font-size:14px;color:var(--muted)}
.rec-msg.bad{color:var(--miss)}
.onset{display:flex;align-items:center;gap:10px;font-family:var(--f-letter);font-weight:700;font-size:clamp(34px,6vw,52px);flex-wrap:wrap;justify-content:center}
.onset .chip{display:inline-flex;align-items:center;gap:6px;background:#eef6fa;border:3px solid var(--line);border-radius:16px;padding:2px 14px}
.onset .chip.r{background:var(--rose)}
.onset .chip svg{width:26px;height:26px}
.danger{background:#fff;border:2px solid var(--miss);color:var(--miss);border-radius:14px;padding:10px 16px;font-size:16px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate{position:fixed;inset:0;background:rgba(38,56,74,.45);display:grid;place-items:center;z-index:30;padding:16px}
.gate .box2{background:#fff;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:380px;width:100%}
.gate .box2 h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:24px}
.gate .nums{display:flex;gap:10px}
.gate .nums button{width:64px;height:64px;border-radius:18px;background:#eef6fa;border:3px solid var(--line);font-family:var(--f-title);font-size:26px}
@media (max-width:520px){
  .cards{gap:10px}.card{min-height:128px;padding:16px 8px}.card .ico{height:52px}
  .dot{width:34px;height:34px;font-size:16px}
  .btn{min-width:0;flex:1 1 140px;font-size:20px}
  .pick button{width:62px;height:72px;font-size:36px}
}
</style>

<div class="wrap" id="app"></div>

/* ---------- 저장 (이 기기에만) ---------- */
const KEY="phonics-reading-a-v1";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function blankRec(){const r={};CATS.forEach(([k])=>r[k]={ok:0,all:0});return r}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||typeof s!=="object")s={};
  if(!s.records)s.records=blankRec();
  CATS.forEach(([k])=>{if(!s.records[k])s.records[k]={ok:0,all:0}});
  if(s.day!==today()){s.day=today();s.done=0}
  if(typeof s.done!=="number")s.done=0;
  return s;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rec(cat,ok){S.records[cat].all++;if(ok)S.records[cat].ok++;save()}

/* ---------- 녹음한 소리 저장 (이 기기의 IndexedDB) ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{try{if(!("indexedDB" in window))return rej("none");const r=indexedDB.open("phonics-audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("clips");r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  st(mode){return IDB.db.transaction("clips",mode).objectStore("clips")},
  put(k,v){return new Promise((res,rej)=>{try{const q=IDB.st("readwrite").put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)}catch(e){rej(e)}})},
  del(k){return new Promise(res=>{try{const q=IDB.st("readwrite").delete(k);q.onsuccess=q.onerror=()=>res()}catch(e){res()}})},
  all(){return new Promise(res=>{try{const s=IDB.st("readonly");const ks=s.getAllKeys(),vs=s.getAll();let n=0;const fin=()=>{if(++n===2)res((ks.result||[]).map((k,i)=>[k,vs.result[i]]))};ks.onsuccess=fin;vs.onsuccess=fin;ks.onerror=vs.onerror=()=>res([])}catch(e){res([])}})}
};
const CLIPS=new Map();let dbReady=false;
async function loadClips(){try{await IDB.open();dbReady=true;(await IDB.all()).forEach(([k,v])=>{if(v&&v.blob)CLIPS.set(k,URL.createObjectURL(v.blob))})}catch(e){dbReady=false}}
function neededKeys(){

    .concat(DATA.rimes.map(x=>({key:"r:"+x,label:"-"+x,ex:EX[x]||"",kind:"끝소리"})));
}
function playKey(k,quiet){const u=CLIPS.get(k);if(!u){if(!quiet)toast("아직 녹음 안 된 소리예요. 부모 관리에서 녹음해요");return}try{new Audio(u).play().catch(()=>toast("소리를 재생하지 못했어요"))}catch(e){}}
/* 녹음 다듬기: 앞뒤 빈 소리 자르기, 크기 맞추기, WAV로 저장 (어느 기기에서나 재생) */
async function processBlob(blob){
  const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();
  const ab=await blob.arrayBuffer();
  const buf=await new Promise((res,rej)=>{const p=ac.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej)});
  try{ac.close()}catch(e){}
  const ch=buf.getChannelData(0),sr=buf.sampleRate;
  let peak=0;for(let i=0;i<ch.length;i++){const v=Math.abs(ch[i]);if(v>peak)peak=v}
  if(peak<0.02)return{err:"소리가 너무 작아요. 기기에 조금 더 가까이 대고 녹음해요"};
  const th=Math.max(0.01,peak*0.08);let s=0,e=ch.length-1;
  while(s<ch.length&&Math.abs(ch[s])<th)s++;while(e>s&&Math.abs(ch[e])<th)e--;
  const pad=Math.floor(sr*0.06);s=Math.max(0,s-pad);e=Math.min(ch.length-1,e+pad);
  const dur=(e-s)/sr;
  if(dur<0.08)return{err:"너무 짧아요. 다시 녹음해요"};
  if(dur>3)return{err:"너무 길어요. 소리 하나만 녹음해요 (3초 안으로)"};
  const g=0.9/peak,out=new Float32Array(e-s);for(let i=0;i<out.length;i++)out[i]=ch[s+i]*g;
  const f=Math.min(out.length>>1,Math.floor(sr*0.01));for(let i=0;i<f;i++){out[i]*=i/f;out[out.length-1-i]*=i/f}
  return{blob:wav(out,sr),dur,warn:peak>=0.99?"소리가 너무 커서 깨졌을 수 있어요. 들어보고 이상하면 조금 떨어져서 다시 녹음해요":null};
}
function wav(f,sr){const b=new ArrayBuffer(44+f.length*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+f.length*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,f.length*2,true);
  for(let i=0;i<f.length;i++){const x=Math.max(-1,Math.min(1,f[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}
  return new Blob([b],{type:"audio/wav"})}

let L=null; // {step, only, review}
function runLesson(step,opt){L={step,only:opt.only||null,review:!!opt.review,single:!!opt.single};renderStep()}
function finishStep(){
  const n=L.step;
  if(!L.review&&n>S.done){S.done=n;save()}
  const more=L.single?false:L.only?L.only.includes(n+1):n<7;
  cheer(n,more);
}
function lessonShell(){
  const s=STEPS[L.step-1];

    h("button",{class:"pill-btn",onclick:home},svg("home"),"처음으로"),
    h("div",{class:"step-name"},s.n+"단계 · "+s.name+(L.review?" (복습)":"")),dots);
  const stage=h("section",{class:"stage"});
  app.append(top,stage);

}
function renderStep(){const st=lessonShell();({1:step1,2:step2,3:step3,4:step4,5:step5,6:step6,7:step7})[L.step](st)}

}
/* 엄마가 듣고 누르는 확인 버튼: 틀리면 한 번 고쳐서 다시 */
function parentCheck(stage,items,draw,cat,done,correctTip){
  let i=0,retry=false;
  function show(){
    stage.replaceChildren();
    stage.append(h("div",{class:"counter"},(i+1)+" / "+items.length));
    draw(stage,items[i]);
    if(retry)stage.append(h("div",{class:"hint"},correctTip));
    stage.append(h("div",{class:"row"},
      h("button",{class:"btn ok",onclick:()=>{rec(cat,true);next()}},"맞았어요"),
      h("button",{class:"btn again",onclick:()=>{rec(cat,false);if(!retry){retry=true;show()}else next()}},"다시 해볼게요")));
  }
  function next(){retry=false;i++;if(i<items.length)show();else done()}
  show();
}

/* 3단계: 새 소리 */

  const n=DATA.newSound;

    ["동작","책에 나온 동작을 같이 해요. 매번 같은 동작이에요."],
    ["공중에 쓰기","엄마가 쓰는 걸 보고, 소리를 말하며 공중에 따라 써요."],
    ["첫소리 찾기",null],
    ["따라 쓰기","책의 쓰기 칸에 "+n+"을 따라 써요."]
  ];

  stage.replaceChildren(h("div",{class:"big pop"},n),soundBtn("s:"+n));

  const finish=h("button",{class:"btn next",disabled:"",style:"opacity:.45"},"다 했어요");
  function upd(){const all=doneSet.size===acts.length;finish.disabled=!all;finish.style.opacity=all?"1":".45"}
  acts.forEach(([t,d],i)=>{
    const b=h(d===null?"div":"button",d===null?{class:"item"}:{class:"item",type:"button"},h("span",{class:"box"}),h("span",null,h("b",null,t),d?" · "+d:" · 엄마가 두 단어를 말해 주면, "+n+"으로 시작하는 단어를 골라요."));
    const li=h("li",null,b);
    if(d===null){
      const mc=h("div",{class:"mini-choice"});
      ["net","pig"].forEach(w=>mc.append(h("button",{type:"button",onclick:(e)=>{e.stopPropagation();const right=w==="net";e.currentTarget.className=right?"right":"wrong";rec("sound",right);if(right){doneSet.add(i);b.classList.add("done");b.querySelector(".box").innerHTML=ICON.check;upd()}else toast("다시 들어봐요. 엄마가 첫소리를 길게 말해 줘요")}},w)));
      b.lastChild.append(mc);
    }else{
      b.addEventListener("click",()=>{if(doneSet.has(i)){doneSet.delete(i);b.classList.remove("done");b.querySelector(".box").innerHTML=""}else{doneSet.add(i);b.classList.add("done");b.querySelector(".box").innerHTML=ICON.check}upd()});
    }

  });

  stage.append(note("하나씩 하고 눌러서 표시해요."),list,finish);

/* 4단계: 글자 하나씩 누르며 소리 내고 합쳐 읽기 */

/* 5단계: 듣고 글자 카드로 단어 만들기 (화면이 정답을 확인) */
function step5(stage){
  const words=DATA.spellWords;let i=0;
  const pool=[...DATA.learned,DATA.newSound];
  function show(){
    const w=words[i];let fails=0;const picked=[];
    stage.replaceChildren();
    stage.append(h("div",{class:"counter"},(i+1)+" / "+words.length));
    stage.append(note("엄마가 단어를 말해 주면 아이가 소리를 나눠서 글자 카드를 골라요. 단어는 아래 버튼을 눌러 엄마만 봐요."));
    const rv=h("button",{class:"reveal",onclick:()=>{rv.replaceChildren("엄마가 읽어 줄 단어: ",h("b",null,w))}},"엄마만 보기 (눌러서 보기)");
    const slots=h("div",{class:"slots"});
    const pick=h("div",{class:"pick"});
    function paint(){
      slots.replaceChildren(...w.split("").map((_,k)=>h("button",{class:"slot"+(picked[k]?" filled":""),onclick:()=>{if(picked[k]){picked.splice(k,1);paint()}}},picked[k]||"")));
    }
    pool.forEach(c=>pick.append(h("button",{onclick:()=>{if(picked.length>=w.length)return;picked.push(c);paint();if(picked.length===w.length)check()}},c)));
    function check(){
      const ok=picked.join("")===w;rec("spell",ok);
      if(ok){slots.classList.add("good");setTimeout(()=>{i++;i<words.length?show():finishStep()},900)}
      else{fails++;slots.classList.remove("shake");void slots.offsetWidth;slots.classList.add("shake");
        if(fails<2){toast("엄마가 소리를 하나씩 다시 말해 줘요");setTimeout(()=>{picked.length=0;paint()},700)}
        else{setTimeout(()=>{picked.length=0;picked.push(...w.split(""));paint();slots.classList.add("good");toast("정답은 "+w+"예요. 같이 읽어 봐요");setTimeout(()=>{i++;i<words.length?show():finishStep()},1800)},700)}}
    }
    paint();stage.append(rv,slots,pick);
  }
  show();
}

    stage.append(h("div",{class:"row"},
      h("button",{class:"btn ok",onclick:()=>{rec("reading",true);ask()}},"다 읽었어요"),
      h("button",{class:"btn again",onclick:()=>{rec("reading",false);if(!retry){retry=true;read()}else ask()}},"다시 해볼게요")));

  app.append(h("section",{class:"panel"},h("h2",null,"단계 바로 가기"),h("p",null,"원하는 단계 하나만 다시 해요. 오늘 진도는 바뀌지 않아요."),
    h("div",{class:"jump"},STEPS.map(s=>h("button",{onclick:()=>runLesson(s.n,{review:true,single:true})},h("b",null,s.n+"단계"),s.name)))));
  const items=neededKeys();const missing=items.filter(x=>!CLIPS.has(x.key)).length;
  app.append(h("section",{class:"panel"},h("h2",null,"음원 녹음"),
    h("p",null,"지금 진도에 필요한 소리예요. 소리 하나만 짧게 내고 멈춤을 눌러요. 앞뒤 빈 소리와 크기는 자동으로 맞춰요. 아직 녹음 안 한 소리: "+missing+"개"),
    h("div",{class:"rec-list"},items.map(recRow))));
  const fileIn=h("input",{type:"file",accept:"application/json,.json",id:"restore-file",hidden:""});
  fileIn.addEventListener("change",()=>{if(fileIn.files&&fileIn.files[0])restore(fileIn.files[0])});
  app.append(h("section",{class:"panel"},h("h2",null,"백업·복원"),
    h("p",null,"학습 기록과 녹음한 소리를 파일 하나로 저장해요. 다른 기기에서 불러오면 그대로 옮겨져요."),
    h("div",{class:"confirm"},h("button",{class:"sbtn go",onclick:makeBackup},"백업 파일 만들기"),h("button",{class:"sbtn",onclick:()=>fileIn.click()},"백업 불러오기"),fileIn)));
  app.append(h("section",{class:"panel"},h("h2",null,"다음에 만들 기능"),
    h("div",{class:"soon"},
      h("div",null,h("b",null,"책 사진 올리기"),"Claude 대화에 사진을 올리면 예시 내용이 그날 단어로 바뀌어요."),
      h("div",null,h("b",null,"단어 소리 자동"),"cat, the 같은 단어 소리를 ElevenLabs로 자동으로 만들어요."))));
  const conf=h("div",{class:"confirm"});
  function ask(label,fn){conf.replaceChildren(h("span",null,label+" 정말 할까요?"),h("button",{class:"danger",onclick:()=>{fn();save();parent();toast("완료했어요")}},"네"),h("button",{class:"pill-btn",onclick:()=>conf.replaceChildren(...base())},"아니요"))}
  function base(){return[h("button",{class:"danger",onclick:()=>ask("오늘 진도 처음으로",()=>{S.done=0})},"오늘 진도 처음으로"),h("button",{class:"danger",onclick:()=>ask("학습 기록 모두 지우기",()=>{S.records=blankRec()})},"학습 기록 모두 지우기")]}
  conf.replaceChildren(...base());
  app.append(h("section",{class:"panel"},h("h2",null,"초기화"),conf));
}

/* 녹음 한 줄 */
function recRow(it){
  const row=h("div",{class:"rec-row"});let mr=null,stream=null,chunks=[],draft=null,draftUrl=null,timer=null;
  const stt=h("span",{class:"stt"+(CLIPS.has(it.key)?" ok":"")},CLIPS.has(it.key)?"등록됨":"녹음 필요");
  const msg=h("div",{class:"rec-msg"},it.kind+" · "+it.ex+"의 "+(it.kind==="낱소리"?"첫소리":"끝부분")+"만 녹음해요");
  const acts=h("div",{class:"acts"});
  function setMsg(t,bad){msg.textContent=t;msg.className="rec-msg"+(bad?" bad":"")}
  function paint(state){acts.replaceChildren();
    if(state==="rec"){acts.append(h("button",{class:"sbtn rec",onclick:stop},"멈춤"));return}
    acts.append(h("button",{class:"sbtn rec",onclick:start},CLIPS.has(it.key)||draft?"다시 녹음":"녹음"));
    if(draft)acts.append(h("button",{class:"sbtn",onclick:()=>{try{new Audio(draftUrl).play().catch(()=>{})}catch(e){}}},"들어보기"),h("button",{class:"sbtn go",onclick:register},"등록"));
    else if(CLIPS.has(it.key))acts.append(h("button",{class:"sbtn",onclick:()=>playKey(it.key)},"등록된 소리 듣기"),h("button",{class:"sbtn",onclick:remove},"지우기"));
  }
  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){setMsg("이 화면에서는 녹음이 안 돼요. github.io 주소로 열어 주세요",true);return}
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:false}})}
    catch(e){setMsg("마이크를 쓸 수 없어요. 브라우저에서 마이크를 허락해 주세요",true);return}
    const types=["audio/mp4","audio/webm;codecs=opus","audio/webm"];
    const type=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
    try{mr=new MediaRecorder(stream,type?{mimeType:type}:undefined)}catch(e){mr=new MediaRecorder(stream)}
    chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=async()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());
      const raw=new Blob(chunks,{type:mr.mimeType||type||"audio/webm"});setMsg("확인하는 중…");
      try{const r=await processBlob(raw);
        if(r.err){setMsg(r.err,true);paint();return}
        if(draftUrl)URL.revokeObjectURL(draftUrl);draft=r;draftUrl=URL.createObjectURL(r.blob);
        setMsg((r.warn?r.warn+" · ":"")+"길이 "+r.dur.toFixed(2)+"초 · 들어보고 괜찮으면 등록해요",!!r.warn);paint();
      }catch(e){setMsg("소리를 읽지 못했어요. 다시 녹음해요",true);paint()}};
    mr.start();setMsg("녹음 중… 소리를 한 번만 내고 멈춤을 눌러요");paint("rec");
    timer=setTimeout(()=>{if(mr&&mr.state==="recording")mr.stop()},6000);
  }
  function stop(){if(mr&&mr.state==="recording")mr.stop()}
  async function register(){if(!draft)return;
    if(!dbReady){setMsg("이 기기에 저장할 수 없어요. 개인정보 보호(비공개) 창이 아닌지 확인해요",true);return}
    try{await IDB.put(it.key,{blob:draft.blob,dur:draft.dur,at:Date.now()});const old=CLIPS.get(it.key);if(old)URL.revokeObjectURL(old);
      CLIPS.set(it.key,URL.createObjectURL(draft.blob));draft=null;stt.className="stt ok";stt.textContent="등록됨";setMsg("등록했어요. 게임에서 이 소리가 나와요");paint()}
    catch(e){setMsg("저장하지 못했어요. 다시 해 봐요",true)}}
  async function remove(){await IDB.del(it.key);const u=CLIPS.get(it.key);if(u)URL.revokeObjectURL(u);CLIPS.delete(it.key);stt.className="stt";stt.textContent="녹음 필요";setMsg("지웠어요. 다시 녹음할 수 있어요");paint()}
  row.append(h("div",{class:"lbl"},it.label),h("div",{class:"ex"},it.ex),stt,acts,msg);paint();return row;
}
/* 백업·복원 */
function b64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>res("");r.readAsDataURL(blob)})}
async function makeBackup(){
  const clips={};if(dbReady)for(const [k,v] of await IDB.all()){if(v&&v.blob)clips[k]={dur:v.dur,at:v.at,type:v.blob.type,data:await b64(v.blob)}}
  const blob=new Blob([JSON.stringify({app:"phonics-reading",version:1,savedAt:new Date().toISOString(),records:S.records,clips})],{type:"application/json"});
  const a=h("a",{href:URL.createObjectURL(blob),download:"phonics-backup-"+today()+".json"});document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("백업 파일을 만들었어요 · 다운로드 폴더를 확인해요");
}
async function restore(file){
  try{const d=JSON.parse(await file.text());if(!d||d.app!=="phonics-reading")throw 0;
    if(d.records){S.records=d.records;CATS.forEach(([k])=>{if(!S.records[k])S.records[k]={ok:0,all:0}});save()}
    let n=0;if(d.clips&&dbReady){for(const k in d.clips){const c=d.clips[k];const bin=atob(c.data);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const blob=new Blob([u8],{type:c.type||"audio/wav"});await IDB.put(k,{blob,dur:c.dur,at:c.at});const o=CLIPS.get(k);if(o)URL.revokeObjectURL(o);CLIPS.set(k,URL.createObjectURL(blob));n++}}
    toast("불러왔어요 · 소리 "+n+"개");parent();
  }catch(e){toast("이 파일은 불러올 수 없어요. 백업 파일이 맞는지 확인해요")}
}

home();
loadClips();
})();

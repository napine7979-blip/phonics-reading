<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style></head><body><title>파닉스 리딩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: A형 카드 메인(하늘→풀밭 배경, 큰 둥근 카드 2x2, 아래 큰 초록 시작 버튼) + 한 화면에 한 활동만 보이는 수업 화면. 아이용 밝은 단일 테마. */
:root{
  --sky:#d3eefa; --meadow:#e4f5dd; --ink:#26384a; --muted:#607487; --paper:#ffffff;
  --sun:#fde7a2; --mint:#c9ecdc; --rose:#fbd2d7; --lilac:#e1daf6;
  --go:#2ea350; --go-deep:#1d8238; --ok:#2ea350; --miss:#d95767; --line:#cfe1ea;
  --f-title:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-letter:"Andika","Comic Sans MS",system-ui,sans-serif; /* 한 층 a, g — 유아 읽기용 글꼴 */
  color-scheme:light;
}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--sky) 0%,#e8f6fb 55%,var(--meadow) 100%);background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #2b7fd6;outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-title);font-size:clamp(22px,3.2vw,30px)}
.brand svg{width:38px;height:38px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:10px 18px;font-family:var(--f-title);font-size:17px;box-shadow:0 2px 0 var(--line)}
.pill-btn svg{width:20px;height:20px}
.hero{display:flex;align-items:flex-end;justify-content:center;margin-bottom:-28px;position:relative;z-index:1}
.lion{width:clamp(110px,16vw,150px);height:auto;border-radius:50%;box-shadow:0 4px 0 rgba(38,56,74,.08)}
.today{background:rgba(255,255,255,.78);border:3px solid #bfe6d2;border-radius:32px;padding:40px clamp(16px,3vw,32px) 24px;display:flex;flex-direction:column;gap:18px;align-items:center}
.today h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(28px,4vw,38px);text-wrap:balance}
.sub{background:var(--mint);border-radius:999px;padding:4px 16px;font-size:15px}
.sample{font-size:14px;color:var(--muted);text-align:center}
.sample b{font-family:var(--f-letter);color:var(--ink);font-size:16px;letter-spacing:.06em}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-title);font-size:18px;background:#fff;border:3px solid var(--line);color:var(--muted)}
.dot.done{background:var(--go);border-color:var(--go);color:#fff}
.dot.now{border-color:var(--go);color:var(--go-deep);background:#eafbef;transform:scale(1.1)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}
.card{position:relative;border-radius:26px;padding:20px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center;box-shadow:0 5px 0 rgba(38,56,74,.08)}
.card .ico{height:64px;display:grid;place-items:center}
.card .ico svg{width:64px;height:64px}
.card .nm{font-family:var(--f-title);font-size:clamp(22px,3vw,28px)}
.card .st{font-size:14px;color:var(--muted)}
.c1{background:var(--sun)} .c2{background:var(--mint)} .c3{background:var(--rose)} .c4{background:var(--lilac)}
.card.locked{opacity:.55}
.badge{position:absolute;top:10px;right:12px;border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.badge.ok{background:var(--go);color:#fff}
.tiles-mini{display:flex;gap:4px}
.tiles-mini span{font-family:var(--f-letter);font-weight:700;font-size:26px;background:#fff;border-radius:10px;width:40px;height:44px;display:grid;place-items:center}
.start{width:min(560px,100%);background:var(--go);color:#fff;border-radius:999px;padding:18px 24px;font-family:var(--f-title);font-size:clamp(26px,3.6vw,34px);display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 0 var(--go-deep)}
.start:active{transform:translateY(3px);box-shadow:0 3px 0 var(--go-deep)}
.start svg{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 20px;font-size:16px;max-width:calc(100% - 32px);z-index:20}
/* lesson */
.lesson-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.step-name{font-family:var(--f-title);font-size:clamp(22px,3vw,28px)}
.stage{background:var(--paper);border-radius:32px;padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:20px;align-items:center;min-height:420px;box-shadow:0 6px 0 rgba(38,56,74,.07)}
.parent-note{width:100%;background:#f3f8fb;border:2px dashed var(--line);border-radius:18px;padding:12px 16px;font-size:16px;line-height:1.55;color:var(--ink)}
.parent-note .who{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;margin-right:6px}
.big{font-family:var(--f-letter);font-weight:700;font-size:clamp(84px,16vw,150px);line-height:1;letter-spacing:.04em}
.big.split{letter-spacing:.35em;color:var(--go-deep)}
.say{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;background:#f1f4f6;border-radius:999px;padding:8px 14px}
.say svg{width:20px;height:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.btn{border-radius:20px;padding:16px 22px;font-family:var(--f-title);font-size:22px;min-width:150px;box-shadow:0 4px 0 rgba(38,56,74,.12)}
.btn.ok{background:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-deep)}
.btn.again{background:#fff;border:3px solid var(--line)}
.btn.next{background:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-deep)}
.hint{width:100%;background:#fff6dc;border-radius:16px;padding:12px 16px;line-height:1.55}
.word-tiles{display:flex;gap:12px;justify-content:center}
.tile{font-family:var(--f-letter);font-weight:700;font-size:clamp(56px,10vw,88px);width:clamp(84px,14vw,120px);height:clamp(96px,16vw,136px);border-radius:22px;background:#eef6fa;border:4px solid var(--line);display:grid;place-items:center}
.tile.lit{background:var(--sun);border-color:#f0c64a}
.blendbar{font-family:var(--f-letter);font-weight:700;font-size:clamp(48px,9vw,76px);background:var(--mint);border-radius:22px;padding:6px 40px}
.slots{display:flex;gap:12px;justify-content:center}
.slot{width:clamp(76px,13vw,110px);height:clamp(88px,15vw,124px);border-radius:20px;border:4px dashed #9fc3d3;display:grid;place-items:center;font-family:var(--f-letter);font-weight:700;font-size:clamp(52px,9vw,80px);background:#fbfdfe}
.slot.filled{border-style:solid;border-color:#f0c64a;background:var(--sun)}
.slots.shake{animation:shake .4s}
.slots.good .slot{border-color:var(--go);background:#dff5e6}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick button{font-family:var(--f-letter);font-weight:700;font-size:44px;width:78px;height:86px;border-radius:18px;background:#eef6fa;border:3px solid var(--line)}
.pick button:disabled{opacity:.3}
.reveal{font-size:15px;background:#f1f4f6;border-radius:12px;padding:8px 14px}
.reveal b{font-family:var(--f-letter);font-size:22px}
.checklist{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:10px}
.checklist .item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#f5f9fb;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-size:17px;line-height:1.45}
.checklist .box{flex:none;width:34px;height:34px;border-radius:10px;border:3px solid #9fc3d3;display:grid;place-items:center;background:#fff}
.checklist .done{border-color:var(--go);background:#ecf9f0}
.checklist .done .box{background:var(--go);border-color:var(--go)}
.checklist .box svg{width:20px;height:20px}
.mini-choice{display:flex;gap:10px;margin-top:8px}
.mini-choice button{font-family:var(--f-letter);font-weight:700;font-size:28px;padding:6px 18px;border-radius:14px;background:#fff;border:3px solid var(--line);width:auto}
.mini-choice button.right{background:#dff5e6;border-color:var(--go)}
.mini-choice button.wrong{background:#fde4e7;border-color:var(--miss)}
.sentence{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-family:var(--f-letter);font-weight:700;font-size:clamp(46px,8vw,72px)}
.sentence button{border-radius:14px;padding:0 6px;border-bottom:5px solid transparent}
.sentence button.lit{background:var(--sun);border-bottom-color:#f0c64a}
.sentence .sw{color:#8a5bd1}
.q{font-family:var(--f-title);font-size:24px}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choices button{font-family:var(--f-letter);font-weight:700;font-size:40px;padding:10px 26px;border-radius:18px;background:#eef6fa;border:3px solid var(--line)}
.choices button.right{background:#dff5e6;border-color:var(--go)}
.choices button.wrong{background:#fde4e7;border-color:var(--miss)}
.counter{font-size:14px;color:var(--muted)}
.cheer{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cheer h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(30px,4.6vw,42px)}
.stars{display:flex;gap:8px}
.stars svg{width:46px;height:46px}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(.7);opacity:.4}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
}
/* parent */
.panel{background:var(--paper);border-radius:28px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:24px}
.panel p{margin:0;line-height:1.6;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:16px}
th{font-size:14px;color:var(--muted);font-weight:400}
.meter{height:10px;border-radius:99px;background:#edf2f5;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--go)}
.jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.jump button{background:#f3f8fb;border:2px solid var(--line);border-radius:16px;padding:12px;font-size:16px;text-align:left;line-height:1.35}
.jump b{font-family:var(--f-title);font-weight:400;font-size:18px;display:block}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.soon div{border:2px dashed var(--line);border-radius:16px;padding:12px;color:var(--muted);font-size:15px;line-height:1.5}
.soon b{color:var(--ink);display:block;font-family:var(--f-title);font-weight:400;font-size:18px}
.speak{display:inline-flex;align-items:center;gap:8px;background:#e6f4fb;border:3px solid #9fd0e6;border-radius:999px;padding:10px 20px;font-family:var(--f-title);font-size:19px}
.speak svg{width:26px;height:26px}
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.rec-row .lbl{font-family:var(--f-letter);font-weight:700;font-size:34px;min-width:70px}
.rec-row .ex{color:var(--muted);font-size:15px;flex:1 1 100px;font-family:var(--f-letter)}
.rec-row .stt{font-size:14px;border-radius:999px;padding:3px 10px;background:#f1f4f6}
.rec-row .stt.ok{background:#dff5e6;color:#1d6b33}
.rec-row .acts{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:15px}
.sbtn.rec{background:var(--miss);border-color:var(--miss);color:#fff}
.sbtn.go{background:var(--go);border-color:var(--go);color:#fff}
.rec-msg{width:100%;font-size:14px;color:var(--muted)}
.rec-msg.bad{color:var(--miss)}
.onset{display:flex;align-items:center;gap:10px;font-family:var(--f-letter);font-weight:700;font-size:clamp(34px,6vw,52px);flex-wrap:wrap;justify-content:center}
.onset .chip{display:inline-flex;align-items:center;gap:6px;background:#eef6fa;border:3px solid var(--line);border-radius:16px;padding:2px 14px}
.onset .chip.r{background:var(--rose)}
.onset .chip svg{width:26px;height:26px}
.danger{background:#fff;border:2px solid var(--miss);color:var(--miss);border-radius:14px;padding:10px 16px;font-size:16px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate{position:fixed;inset:0;background:rgba(38,56,74,.45);display:grid;place-items:center;z-index:30;padding:16px}
.gate .box2{background:#fff;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:380px;width:100%}
.gate .box2 h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:24px}
.gate .nums{display:flex;gap:10px}
.gate .nums button{width:64px;height:64px;border-radius:18px;background:#eef6fa;border:3px solid var(--line);font-family:var(--f-title);font-size:26px}
@media (max-width:520px){
  .cards{gap:10px}.card{min-height:128px;padding:16px 8px}.card .ico{height:52px}
  .dot{width:34px;height:34px;font-size:16px}
  .btn{min-width:0;flex:1 1 140px;font-size:20px}
  .pick button{width:62px;height:72px;font-size:36px}
}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 20px;font-family:var(--f-title);font-size:18px}
.seg button.on{background:var(--go);border-color:var(--go);color:#fff}
td.lt{font-family:var(--f-letter);font-size:18px;letter-spacing:.02em}
.sheet{background:#fff;border-radius:20px;padding:clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:12px;color:#222}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;border-bottom:2px solid #222;padding-bottom:8px}
.sheet-head h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:28px}
.sheet h3{margin:14px 0 4px;font-family:var(--f-title);font-weight:400;font-size:20px}
.trace{display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--f-letter);font-weight:700;font-size:72px;line-height:1.1;border-top:1px dashed #9ab;border-bottom:1px dashed #9ab;padding:4px 0}
.trace span{color:transparent;-webkit-text-stroke:2px #8aa;text-stroke:2px #8aa}
.trace span:first-child{color:#222;-webkit-text-stroke:0}
.readgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;font-family:var(--f-letter);font-weight:700;font-size:34px}
.readgrid div{display:flex;align-items:center;gap:10px}
.readgrid i{width:24px;height:24px;border:2px solid #222;border-radius:5px;flex:none}
.circ{display:flex;flex-direction:column;gap:8px}
.circ div{display:flex;gap:40px;font-family:var(--f-letter);font-weight:700;font-size:34px}
.lines{display:flex;flex-direction:column;gap:22px}
.lines div{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid #222;height:52px}
.lines b{font-size:18px}
.lines .ans{margin-left:auto;font-size:12px;color:#8a99a6}
.sheet-foot{margin:10px 0 0;font-size:12px;color:#8a99a6}
@media print{
  body{background:#fff!important}
  .no-print,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{border-radius:0;padding:0}
  .lines .ans{display:none}
}
.listen{display:inline-flex;align-items:center;gap:10px;background:#e6f4fb;border:3px solid #9fd0e6;border-radius:999px;padding:12px 26px;font-family:var(--f-title);font-size:22px}
.listen svg{width:30px;height:30px}
.big-choices button{min-width:120px;font-size:clamp(40px,7vw,56px);padding:14px 28px;border-radius:22px}
.big-choices button.lt{min-width:110px}
.big-choices button:disabled{opacity:.5}
.sound-opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.sopt{display:flex;flex-direction:column;align-items:center;gap:4px;width:110px;padding:14px 0;border-radius:22px;background:#eef6fa;border:3px solid var(--line);font-family:var(--f-title);font-size:22px}
.sopt svg{width:40px;height:40px}
.sopt.sel{border-color:#2b7fd6;background:#e3efff}
.sopt.right{border-color:var(--go);background:#dff5e6}
.sopt.wrong{border-color:var(--miss);background:#fde4e7}
.sopt:disabled{opacity:.5}
